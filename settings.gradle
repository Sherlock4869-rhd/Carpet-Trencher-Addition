pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "Stonecutter"
			url = "https://maven.kikugie.dev/releases"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.9.7"
}

stonecutter {
	kotlinController = false
	centralScript = "build.gradle"
	create(rootProject) {
		versions(
				"1.21",
				"1.21.2",
				"1.21.3",
				"1.21.4",
				"1.21.5",
				"1.21.8",
				"1.21.10",
				"1.21.11",
				"26.1",
				"26.2"
		)
		vcsVersion = "1.21.10"
	}
}

rootProject.name = "carpet-trencher-addition"