pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		maven {
			name = "Stonecutter"
			url = "https://maven.kikugie.dev/releases"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.9.7"
	// 已移除 dev.kikugie.loom-back-compat
}

stonecutter {
	kotlinController = false
	centralScript = "build.gradle"

	create(rootProject) {
		versions(
				"1.21.10",
				"26.1",
				"26.2"
		)
		vcsVersion = "1.21.10"
	}
}

rootProject.name = "carpet-trencher-addition"